<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Wordle</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 20px; }
    #grid { display: grid; grid-template-rows: repeat(6, 1fr); grid-gap: 5px; margin-bottom: 20px; }
    .row { display: grid; grid-template-columns: repeat(5, 1fr); grid-gap: 5px; }
    .cell { width: 60px; height: 60px; border: 2px solid #ccc; display: flex; justify-content: center; align-items: center; font-size: 2rem; text-transform: uppercase; }
    .cell.filled { border-color: #999; }
    .correct { background-color: #6aaa64; color: white; }
    .present { background-color: #c9b458; color: white; }
    .absent { background-color: #787c7e; color: white; }
    #keyboard { display: flex; flex-direction: column; align-items: center; }
    .key-row { display: flex; }
    .key { margin: 2px; padding: 10px 12px; border: 1px solid #999; border-radius: 4px; cursor: pointer; user-select: none; }
    .key:active { background: #ddd; }
    .key.wide { flex: 1.5; text-align: center; }
  </style>
</head>
<body>
  <h1>Mini Wordle</h1>
  <div id="grid"></div>
  <div id="keyboard">
    <div class="key-row" id="row1"></div>
    <div class="key-row" id="row2"></div>
    <div class="key-row" id="row3"></div>
  </div>
  <script>
    const MAX_ROWS = 6, COLS = 5;
    let ANSWER, WORDS = [], currentRow, currentCol;
    const grid = document.getElementById('grid');
    const keyboard = document.getElementById('keyboard');
    const layout = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];

    fetch('words.txt')
      .then(res => res.text())
      .then(text => {
        WORDS = text.split(/\r?\n/).filter(w => w.length === COLS);
        startGame();
      })
      .catch(() => {
        WORDS = ['apple','berry','mango'];
        startGame();
      });

    function startGame() {
      currentRow = 0;
      currentCol = 0;
      ANSWER = "anton";
      grid.innerHTML = '';
      buildGrid();
      buildKeyboard();
      attachHandlers();
    }

    function buildGrid() {
      for (let r = 0; r < MAX_ROWS; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          row.appendChild(cell);
        }
        grid.appendChild(row);
      }
    }

    function buildKeyboard() {
      layout.forEach((rowStr, i) => {
        const rowDiv = document.getElementById('row' + (i+1));
        rowDiv.innerHTML = '';
        if (i === 2) {
          rowDiv.appendChild(createKey('Enter', 'wide'));
        }
        for (let char of rowStr) {
          rowDiv.appendChild(createKey(char));
        }
        if (i === 2) {
          rowDiv.appendChild(createKey('Backspace', 'wide'));
        }
      });
    }

    function createKey(label, extraClass='') {
      const key = document.createElement('div');
      key.textContent = label;
      key.className = 'key ' + extraClass;
      key.addEventListener('click', () => handleKey(label));
      return key;
    }

    function attachHandlers() {
      document.onkeydown = e => handleKey(e.key);
    }

    function handleKey(key) {
      if (currentRow >= MAX_ROWS) return;
      const row = grid.children[currentRow];
      if (key === 'Backspace') {
        if (currentCol > 0) {
          currentCol--; const cell = row.children[currentCol];
          cell.textContent = '';
          cell.classList.remove('filled');
        }
      } else if (key === 'Enter') {
        if (currentCol === COLS) processGuess(row);
      } else if (/^[a-zA-Z]$/.test(key)) {
        if (currentCol < COLS) {
          const cell = row.children[currentCol];
          cell.textContent = key.toUpperCase();
          cell.classList.add('filled');
          currentCol++;
        }
      }
    }

    function processGuess(row) {
      let guess = '';
      for (let i = 0; i < COLS; i++) guess += row.children[i].textContent.toLowerCase();
      if (!WORDS.includes(guess)) { alert('Not in word list'); return; }
      const answerArr = ANSWER.split('');
      const guessArr = guess.split('');
      const result = Array(COLS).fill('absent');
      for (let i = 0; i < COLS; i++) if (guessArr[i] === answerArr[i]) { result[i] = 'correct'; answerArr[i] = null; }
      for (let i = 0; i < COLS; i++) if (result[i] !== 'correct') {
        const idx = answerArr.indexOf(guessArr[i]); if (idx !== -1) { result[i] = 'present'; answerArr[idx] = null; }
      }
      for (let i = 0; i < COLS; i++) row.children[i].classList.add(result[i]);
      if (guess === ANSWER) { setTimeout(() => alert('You Win!'), 10); currentRow = MAX_ROWS; return; }
      currentRow++; currentCol = 0;
    }
  </script>
</body>
</html>
