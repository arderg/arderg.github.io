<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#ffffff" id="theme-color-meta">
  <title>Mini Wordle</title>
  <style>
    :root {
      /* Light-mode defaults */
      --bg-light: #ffffff;
      --text-light: #1a1a1b;  /* WCAG AA compliant contrast ratio: 15.6:1 */
      --border-light: #cccccc;
      --cell-border-light: #cccccc;
      --key-bg-light: #d3d6da;
      --key-text-light: #1a1a1b;  /* WCAG AA compliant contrast ratio: 15.6:1 */
      --correct-bg-light: #6aaa64;
      --present-bg-light: #c9b458;
      --absent-bg-light: #787c7e;
      --modal-bg-light: #ffffff;
      --modal-overlay-light: rgba(0, 0, 0, 0.5);
      --review-bg-light: #f5f5f5;
      --guess-bg-light: #ffffff;
      --guess-shadow-light: rgba(0, 0, 0, 0.1);

      /* Dark-mode defaults */
      --bg-dark: #121212;
      --text-dark: #ffffff;  /* WCAG AA compliant contrast ratio: 21:1 */
      --border-dark: #444444;
      --cell-border-dark: #444444;
      --key-bg-dark: #818384;
      --key-text-dark: #ffffff;  /* WCAG AA compliant contrast ratio: 13.5:1 */
      --correct-bg-dark: #538d4e;
      --present-bg-dark: #b59f3b;
      --absent-bg-dark: #3a3a3c;
      --modal-bg-dark: #1e1e1e;
      --modal-overlay-dark: rgba(0, 0, 0, 0.7);
      --review-bg-dark: #2d2d2d;
      --guess-bg-dark: #2d2d2d;
      --guess-shadow-dark: rgba(0, 0, 0, 0.3);

      /* Keyboard scaling variables */
      --key-gap: 0.4rem;
      --key-font: 1.2rem;
      --key-backspace-font: 1.4rem;
      --key-border: 0.0625rem;
      --key-radius: 0.25rem;
      --key-padding: 0;
      --keyboard-padding: 0.5rem;
      --keyboard-max-width: 37.5rem;

      /* Current values - will be set by theme classes */
      --bg: var(--bg-light);
      --text: var(--text-light);
      --border: var(--border-light);
      --cell-border: var(--cell-border-light);
      --key-bg: var(--key-bg-light);
      --key-text: var(--key-text-light);
      --correct-bg: var(--correct-bg-light);
      --present-bg: var(--present-bg-light);
      --absent-bg: var(--absent-bg-light);
      --modal-bg: var(--modal-bg-light);
      --modal-overlay: var(--modal-overlay-light);
      --review-bg: var(--review-bg-light);
      --guess-bg: var(--guess-bg-light);
      --guess-shadow: var(--guess-shadow-light);
    }

    /* Respect OS color scheme preference for initial page load */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --text: var(--text-dark);
        --border: var(--border-dark);
        --cell-border: var(--cell-border-dark);
        --key-bg: var(--key-bg-dark);
        --key-text: var(--key-text-dark);
        --correct-bg: var(--correct-bg-dark);
        --present-bg: var(--present-bg-dark);
        --absent-bg: var(--absent-bg-dark);
        --modal-bg: var(--modal-bg-dark);
        --modal-overlay: var(--modal-overlay-dark);
        --review-bg: var(--review-bg-dark);
        --guess-bg: var(--guess-bg-dark);
        --guess-shadow: var(--guess-shadow-dark);
        color-scheme: dark;
      }
    }

    .theme-light {
      --bg: var(--bg-light);
      --text: var(--text-light);
      --border: var(--border-light);
      --cell-border: var(--cell-border-light);
      --key-bg: var(--key-bg-light);
      --key-text: var(--key-text-light);
      --correct-bg: var(--correct-bg-light);
      --present-bg: var(--present-bg-light);
      --absent-bg: var(--absent-bg-light);
      --modal-bg: var(--modal-bg-light);
      --modal-overlay: var(--modal-overlay-light);
      --review-bg: var(--review-bg-light);
      --guess-bg: var(--guess-bg-light);
      --guess-shadow: var(--guess-shadow-light);
      color-scheme: light;
    }

    .theme-dark {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --border: var(--border-dark);
      --cell-border: var(--cell-border-dark);
      --key-bg: var(--key-bg-dark);
      --key-text: var(--key-text-dark);
      --correct-bg: var(--correct-bg-dark);
      --present-bg: var(--present-bg-dark);
      --absent-bg: var(--absent-bg-dark);
      --modal-bg: var(--modal-bg-dark);
      --modal-overlay: var(--modal-overlay-dark);
      --review-bg: var(--review-bg-dark);
      --guess-bg: var(--guess-bg-dark);
      --guess-shadow: var(--guess-shadow-dark);
      color-scheme: dark;
    }

    /* Base Styles */
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      box-sizing: border-box; 
      font-size: 16px;
    }
    body { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      font-family: sans-serif; 
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Toolbar */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3.5rem;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 1rem;
      z-index: 1000;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* Theme Toggle Button */
    #theme-toggle {
      padding: 0.625rem;
      border: none;
      border-radius: 50%;
      background: var(--key-bg);
      color: var(--key-text);
      cursor: pointer;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    #theme-toggle:hover {
      opacity: 0.8;
    }

    /* Game Container - Updated to account for toolbar */
    .game-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin: 3.5rem auto 0;
      padding: 1.25rem;
    }

    #mini-wordle-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Game Grid */
    #grid { 
      display: grid; 
      grid-template-rows: repeat(6, 1fr); 
      grid-gap: 0.3125rem; 
      margin-bottom: 1.25rem; 
    }
    .row { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      grid-gap: 0.3125rem; 
    }
    .cell { 
      width: 3.75rem; 
      height: 3.75rem; 
      border: 0.125rem solid var(--cell-border); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 2rem; 
      text-transform: uppercase; 
      color: var(--text);
      transform-origin: center;
    }
    .cell.filled { 
      border-color: var(--border);
      animation: cellPress 0.2s ease;
    }
    .correct { background-color: var(--correct-bg); color: white; }
    .present { background-color: var(--present-bg); color: white; }
    .absent { background-color: var(--absent-bg); color: white; }

    /* Keyboard */
    #keyboard { 
      display: flex;
      flex-direction: column;
      gap: var(--key-gap);
      width: 100%;
      max-width: var(--keyboard-max-width);
      margin: 0 auto 1rem;
      padding: 0 var(--keyboard-padding);
      box-sizing: border-box;
    }
    .key-row { 
      display: flex;
      justify-content: center;
      gap: var(--key-gap);
    }
    .key { 
      width: 2.5rem;
      height: 2.5rem;
      padding: var(--key-padding);
      border: var(--key-border) solid var(--border); 
      border-radius: var(--key-radius); 
      cursor: pointer; 
      user-select: none;
      background-color: var(--key-bg);
      color: var(--key-text);
      font-weight: bold;
      font-size: var(--key-font);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-sizing: border-box;
      transform-origin: center;
    }
    .key:active { 
      background: #bbb;
      animation: keyPress 0.2s ease;
    }
    .key.wide { 
      width: 3.75rem;
    }
    
    .key.backspace {
      font-size: var(--key-backspace-font);
      width: 3.75rem;
    }
    
    /* Keyboard letter states */
    .key.absent {
      background-color: var(--absent-bg);
      color: white;
      border-color: var(--absent-bg);
    }
    .key.present {
      background-color: var(--present-bg);
      color: white;
      border-color: var(--present-bg);
    }
    .key.correct {
      background-color: var(--correct-bg);
      color: white;
      border-color: var(--correct-bg);
    }

    /* Game Status and Controls */
    #gameStatus { 
      margin: 10px 0; 
      font-size: 1.2rem; 
      text-align: center; 
      min-height: 1.5em; 
      color: var(--text);
    }
    #buttonContainer {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    .game-button { 
      margin: 10px 5px;
      padding: 10px 20px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    /* Button Styles */
    #newGameBtn { background-color: var(--correct-bg); }
    #newGameBtn:hover { background-color: var(--correct-bg-dark); }
    #newGameBtn:active { background-color: var(--correct-bg-dark); }
    
    #playAgainBtn {
      background-color: var(--key-bg);
      display: none;
    }
    #playAgainBtn:hover { opacity: 0.9; }
    #playAgainBtn:active { opacity: 0.8; }
    
    #reviewBtn {
      background-color: var(--present-bg);
      display: none;
    }
    #reviewBtn:hover { opacity: 0.9; }
    #reviewBtn:active { opacity: 0.8; }
    
    #solverBtn {
      background-color: var(--key-bg);
      display: none;
    }
    #solverBtn:hover { opacity: 0.9; }
    #solverBtn:active { opacity: 0.8; }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--modal-overlay);
      z-index: 1000;
    }
    .modal-content {
      position: relative;
      background-color: var(--modal-bg);
      margin: 5% auto;
      padding: 20px;
      width: 90%;
      max-width: 600px;
      border-radius: 8px;
      box-shadow: 0 4px 6px var(--guess-shadow);
      max-height: 90vh;
      overflow-y: auto;
      color: var(--text);
    }
    .close-modal {
      position: absolute;
      right: 10px;
      top: 10px;
      font-size: 24px;
      cursor: pointer;
      color: var(--text);
      opacity: 0.7;
    }
    .close-modal:hover { opacity: 1; }

    /* Review Section Styles */
    .review-section {
      margin: 20px 0;
      padding: 15px;
      background-color: var(--review-bg);
      border-radius: 4px;
    }
    .review-section h3 {
      margin-top: 0;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }
    .guess-history {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .guess-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 10px;
      background-color: var(--guess-bg);
      border-radius: 4px;
      box-shadow: 0 1px 3px var(--guess-shadow);
    }
    .guess-number {
      font-weight: bold;
      color: var(--text);
      opacity: 0.7;
      min-width: 60px;
    }
    .guess-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .guess-cell {
      width: 35px;
      height: 35px;
      border: 2px solid var(--cell-border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .guess-result {
      margin-left: auto;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .guess-result.correct { background-color: var(--correct-bg); color: white; }
    .guess-result.incorrect { background-color: var(--absent-bg); color: white; }

    /* Game Summary Styles */
    .game-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .summary-item {
      background-color: var(--guess-bg);
      padding: 15px;
      border-radius: 4px;
      box-shadow: 0 1px 3px var(--guess-shadow);
    }
    .summary-item h4 {
      margin: 0 0 10px 0;
      color: var(--text);
      opacity: 0.7;
    }
    .summary-item p {
      margin: 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text);
    }

    /* Guess Analysis Styles */
    .guess-analysis {
      margin-top: 10px;
      padding: 12px;
      background-color: var(--review-bg);
      border-radius: 6px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .guess-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 10px 0;
      padding: 10px;
      background-color: var(--guess-bg);
      border-radius: 6px;
      box-shadow: 0 1px 3px var(--guess-shadow);
    }
    .guess-comparison > div {
      padding: 10px;
      border-radius: 4px;
    }
    .guess-comparison .user-guess {
      background-color: var(--review-bg);
      border: 1px solid var(--border);
    }
    .guess-comparison .best-guess {
      background-color: var(--review-bg);
      border: 1px solid var(--border);
    }
    .guess-comparison .label {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .guess-comparison .word {
      font-family: 'Courier New', monospace;
      font-size: 1.2em;
      font-weight: bold;
      padding: 5px 0;
      text-align: center;
      color: var(--text);
    }
    .guess-comparison .optimal {
      color: var(--correct-bg);
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
      padding: 4px;
      background-color: var(--review-bg);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .guess-comparison .suboptimal {
      color: var(--absent-bg);
      text-align: center;
      margin-top: 8px;
      padding: 4px;
      background-color: var(--review-bg);
      border-radius: 4px;
      font-size: 0.9rem;
    }

    /* Remaining Words Styles */
    .remaining-words {
      margin-top: 12px;
      padding: 10px;
      background-color: var(--guess-bg);
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .word-count {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }
    .possible-words {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: var(--text);
      opacity: 0.7;
      max-height: 80px;
      overflow-y: auto;
      padding: 8px;
      background-color: var(--review-bg);
      border-radius: 4px;
      line-height: 1.4;
    }

    /* Modal Footer */
    .modal-footer {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .modal-footer .game-button {
      min-width: 120px;
    }

    /* Game Settings Styles */
    .game-settings {
      margin: 20px 0;
      padding: 15px;
      background-color: var(--review-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .setting-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      position: relative;
    }
    .setting-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .setting-item span {
      font-size: 1.1rem;
      color: var(--text);
    }
    .setting-tooltip {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 10px;
      padding: 8px 12px;
      background-color: var(--modal-bg);
      color: var(--text);
      border-radius: 4px;
      font-size: 0.9rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      box-shadow: 0 2px 4px var(--guess-shadow);
    }
    .setting-item:hover .setting-tooltip {
      opacity: 1;
    }

    /* Mobile-specific styles */
    body.is-mobile .keyboard {
      padding: 0 0.2rem;
      grid-row-gap: 0.3rem;
      grid-column-gap: 0.3rem;
    }
    body.is-mobile .key-row {
      gap: 0.3rem;
    }
    body.is-mobile .game-container {
      padding: 0.75rem;
    }
    body.is-mobile #theme-toggle {
      top: 0.75rem;
      right: 0.75rem;
      width: 2rem;
      height: 2rem;
      font-size: 1rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      :root {
        --key-font: 1.1rem;
        --key-backspace-font: 1.3rem;
        --key-gap: 0.35rem;
      }
    }

    @media (max-width: 600px) {
      :root {
        --key-font: 1rem;
        --key-backspace-font: 1.2rem;
        --key-gap: 0.3rem;
        --keyboard-padding: 0.4rem;
      }
    }

    @media (max-width: 400px) {
      :root {
        --key-font: 0.9rem;
        --key-backspace-font: 1.1rem;
        --key-gap: 0.25rem;
        --keyboard-padding: 0.3rem;
      }
    }

    @media (max-width: 320px) {
      :root {
        --key-font: 0.8rem;
        --key-backspace-font: 1rem;
        --key-gap: 0.2rem;
        --keyboard-padding: 0.25rem;
      }
    }

    @keyframes keyPress {
      0% { transform: scale(1); }
      50% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }

    @keyframes cellPress {
      0% { transform: scale(1); }
      50% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="theme-toggle" aria-label="Toggle dark mode">🌓</button>
  </div>
  <div class="game-container">
    <div id="mini-wordle-wrapper">
      <h1>Mini Wordle</h1>
      <div id="gameStatus"></div>
      <div id="grid"></div>
      <div id="keyboard">
        <div class="key-row" id="row1"></div>
        <div class="key-row" id="row2"></div>
        <div class="key-row" id="row3"></div>
      </div>
      <div id="buttonContainer">
        <button id="newGameBtn" class="game-button">New Game</button>
        <button id="reviewBtn" class="game-button">Review</button>
        <button id="playAgainBtn" class="game-button">Play Again</button>
      </div>

      <div id="gameSettings" class="game-settings">
        <label class="setting-item">
          <input type="checkbox" id="hardModeToggle">
          <span>Hard Mode</span>
          <div class="setting-tooltip">In Hard Mode, suggested guesses must use all revealed hints</div>
        </label>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div id="reviewModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Game Review</h2>
      <div class="game-summary">
        <div class="summary-item">
          <h4>Answer</h4>
          <p id="reviewAnswer"></p>
        </div>
        <div class="summary-item">
          <h4>Attempts</h4>
          <p id="reviewAttempts"></p>
        </div>
        <div class="summary-item">
          <h4>Result</h4>
          <p id="reviewResult"></p>
        </div>
      </div>
      <div id="guessHistory" class="guess-history"></div>
      <button id="modalPlayAgainBtn" class="game-button">Play Again</button>
    </div>
  </div>

  <!-- Load scripts with defer -->
  <script type="module" src="src/main.js" defer></script>
  <script defer>
    const root = document.documentElement;
    const toggleBtn = document.getElementById('theme-toggle');
    const wrapper = document.getElementById('mini-wordle-wrapper');
    const themeColorMeta = document.getElementById('theme-color-meta');

    // Mobile detection
    function checkMobile() {
      document.body.classList.toggle('is-mobile', window.innerWidth <= 600);
    }
    
    // Initial check
    checkMobile();
    
    // Listen for resize
    window.addEventListener('resize', checkMobile);

    // Read saved theme or OS preference
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
      root.classList.add('theme-dark');
      themeColorMeta.setAttribute('content', '#121212');
    } else {
      root.classList.add('theme-light');
      themeColorMeta.setAttribute('content', '#ffffff');
    }

    // Toggle function
    function toggleTheme() {
      const isDark = root.classList.toggle('theme-dark');
      root.classList.toggle('theme-light', !isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      toggleBtn.textContent = isDark ? '☀️' : '🌙';
      themeColorMeta.setAttribute('content', isDark ? '#121212' : '#ffffff');
    }

    // Button click
    toggleBtn.addEventListener('click', toggleTheme);

    // Double-click on wrapper
    wrapper.addEventListener('dblclick', (e) => {
      // Only toggle if clicking on the wrapper itself, not its children
      if (e.target === wrapper) {
        toggleTheme();
      }
    });

    // Listen for system theme changes
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        const isDark = e.matches;
        root.classList.toggle('theme-dark', isDark);
        root.classList.toggle('theme-light', !isDark);
        toggleBtn.textContent = isDark ? '☀️' : '🌙';
        themeColorMeta.setAttribute('content', isDark ? '#121212' : '#ffffff');
      }
    });
  </script>
</body>
</html>
